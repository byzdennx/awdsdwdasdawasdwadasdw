<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Musicaly API Explorer</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background: radial-gradient(circle at top, #1e1b4b 0%, #0f172a 60%, #020617 100%); }
  .glow { box-shadow: 0 0 40px -10px rgba(139,92,246,0.6); }
</style>
</head>
<body class="min-h-screen text-slate-200 font-sans">

  <!-- Header -->
  <header class="border-b border-white/10 backdrop-blur bg-slate-900/40 sticky top-0 z-10">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-violet-500 to-fuchsia-600 flex items-center justify-center text-xl font-bold glow">♪</div>
        <div>
          <h1 class="font-bold text-lg leading-tight">Musicaly API</h1>
          <p class="text-xs text-slate-400">by MyEx · Railway</p>
        </div>
      </div>
      <a href="/api" target="_blank" class="text-xs px-3 py-1.5 rounded-lg border border-white/10 hover:bg-white/5 transition">/api</a>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-6 py-10">

    <!-- Tabs -->
    <div class="flex flex-wrap gap-2 mb-6" id="tabs">
      <button data-tab="search"  class="tab-btn px-4 py-2 rounded-lg bg-violet-600 text-white font-medium text-sm">🔍 Search</button>
      <button data-tab="album"   class="tab-btn px-4 py-2 rounded-lg bg-white/5 hover:bg-white/10 text-sm">💿 Album</button>
      <button data-tab="artist"  class="tab-btn px-4 py-2 rounded-lg bg-white/5 hover:bg-white/10 text-sm">🎤 Artist</button>
      <button data-tab="lyrics"  class="tab-btn px-4 py-2 rounded-lg bg-white/5 hover:bg-white/10 text-sm">📜 Lyrics</button>
      <button data-tab="ytplay"  class="tab-btn px-4 py-2 rounded-lg bg-white/5 hover:bg-white/10 text-sm">🎧 YT Play</button>
      <button data-tab="suggest" class="tab-btn px-4 py-2 rounded-lg bg-white/5 hover:bg-white/10 text-sm">💡 Suggest</button>
      <button data-tab="transcribe" class="tab-btn px-4 py-2 rounded-lg bg-white/5 hover:bg-white/10 text-sm">🎙️ Transcribe</button>
      <button data-tab="translate" class="tab-btn px-4 py-2 rounded-lg bg-white/5 hover:bg-white/10 text-sm">🌐 Translate</button>
    </div>

    <!-- Form Panel -->
    <div class="bg-slate-900/60 border border-white/10 rounded-2xl p-6 mb-6">
      <form id="apiForm" class="space-y-4">
        <div id="fields" class="grid md:grid-cols-2 gap-4"></div>
        <button type="submit" class="w-full md:w-auto px-6 py-2.5 rounded-lg bg-gradient-to-r from-violet-600 to-fuchsia-600 hover:opacity-90 font-medium text-sm glow transition">
          Kirim Request →
        </button>
      </form>
    </div>

    <!-- Result -->
    <div class="bg-slate-900/60 border border-white/10 rounded-2xl p-6">
      <div class="flex items-center justify-between mb-4">
        <h2 class="font-semibold text-slate-300">Response</h2>
        <button id="copyBtn" class="text-xs px-3 py-1.5 rounded-lg border border-white/10 hover:bg-white/5">Copy JSON</button>
      </div>
      <pre id="output" class="text-xs md:text-sm text-emerald-300 overflow-auto max-h-[600px] whitespace-pre-wrap"></pre>
    </div>
  </main>

<script>
const API = window.location.origin;

const SCHEMAS = {
  search:    [{ n: 'q', ph: 'judul lagu / artis', req: true }, { n: 'type', ph: 'all|songs|playlists|artists', val: 'all' }],
  album:     [{ n: 'id', ph: 'browseId album / playlist', req: true }],
  artist:    [{ n: 'id', ph: 'browseId artist (UC...)', req: true }],
  lyrics:    [{ n: 'id', ph: 'videoId', req: true }, { n: 'title', ph: 'judul (opsional)' }, { n: 'artist', ph: 'artis (opsional)' }],
  ytplay:    [{ n: 'url', ph: 'videoId atau URL YouTube', req: true }],
  suggest:   [{ n: 'q', ph: 'kata kunci', req: true }],
  transcribe:[{ n: 'url', ph: 'videoId atau URL YouTube', req: true }],
  translate: [{ n: 'text', ph: 'teks yang ingin diterjemahkan', req: true }, { n: 'tl', ph: 'target lang', val: 'id' }],
};

let currentTab = 'search';

function renderFields(tab) {
  const fields = document.getElementById('fields');
  fields.innerHTML = SCHEMAS[tab].map(f => `
    <div>
      <label class="block text-xs text-slate-400 mb-1.5">${f.n} ${f.req ? '<span class="text-rose-400">*</span>' : ''}</label>
      <input name="${f.n}" placeholder="${f.ph}" value="${f.val || ''}"
        class="w-full px-3 py-2 rounded-lg bg-slate-800/60 border border-white/10 focus:border-violet-500 outline-none text-sm" />
    </div>
  `).join('');
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => {
      b.className = 'tab-btn px-4 py-2 rounded-lg bg-white/5 hover:bg-white/10 text-sm';
    });
    btn.className = 'tab-btn px-4 py-2 rounded-lg bg-violet-600 text-white font-medium text-sm';
    currentTab = btn.dataset.tab;
    renderFields(currentTab);
    document.getElementById('output').textContent = '';
  });
});

document.getElementById('apiForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = new FormData(e.target);
  const params = new URLSearchParams();
  for (const [k, v] of form.entries()) if (v) params.append(k, v);

  const url = `${API}/api/${currentTab}?${params}`;
  const out = document.getElementById('output');
  out.textContent = '⏳ Loading...';

  try {
    const r = await fetch(url);
    const j = await r.json();
    out.textContent = JSON.stringify(j, null, 2);
  } catch (err) {
    out.textContent = '❌ ' + err.message;
  }
});

document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('output').textContent);
});

renderFields('search');
</script>
</body>
</html>
